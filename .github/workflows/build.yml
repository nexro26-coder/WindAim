
name: Build Wind Assist

on:
  workflow_dispatch:
  push:
    paths:
      - 'wind-assist-fabric-1.21.11-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          unzip -q wind-assist-fabric-1.21.11-source.zip
          
      - name: Build mod
        run: |
          cd wind-assist
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WindAssist-1.21.11
          path: wind-assist/build/libs/*.jar
